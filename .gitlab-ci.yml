variables:
  ImageName: pgtgs/backoffice-api
  TgsSettingKey: backoffice-api
  HelmTemplateFolderName: backoffice-api

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  stage: build
  script:
    - dotnet build -c $BuildConfiguration
  only:
    - merge_requests
    - main
  cache:
    key: Tgs.BoApi.$CI_PIPELINE_ID
    untracked: true

unit-test:
  stage: test
  script:
    - dotnet test -c $BuildConfiguration -l:"junit;LogFilePath=../TestReports/{assembly}-TestReport.xml" --no-restore --no-build
  needs:
    - build-code
  only:
    - merge_requests
    - main
  cache:
    key: Tgs.BoApi.$CI_PIPELINE_ID
    untracked: true
    policy: pull
  artifacts:
    when: always
    reports:
      junit: ./TestReports/*-TestReport.xml

push-docker-image:
  stage: publish
  needs:
    - build-code
    - unit-test
  only:
    - main
  cache:
    key: Tgs.BoApi.$CI_PIPELINE_ID
    untracked: true
    policy: pull
  script:
    - export Tag="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"
    - dotnet build "BackendOffice/BackendOffice.csproj" -c $BuildConfiguration -t:ContainerBuild -p:DockerfileTag="$ImageName:$Tag" --no-restore
    - docker push $ImageName:$Tag

push-k8s-template:
  stage: publish
  needs:
    - unit-test
  only:
    - main
  script:
    - export Tag="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"
    - mkdir -p artifacts/k8s
    - cp -R deployment/k8s/$HelmTemplateFolderName artifacts/k8s/
    - |
      yq -i e '
        .image.repository = strenv(ImageName) |
        .image.tag = strenv(Tag)
      ' artifacts/k8s/$HelmTemplateFolderName/values.yaml
  artifacts:
    name: HelmTemplate
    untracked: false
    expire_in: "180 days"
    paths:
      - artifacts/**/*

deploy-dev:
  variables:
    GIT_STRATEGY: none
    namespace: dev
  environment:
    name: dev
  stage: deploy-dev
  needs:
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  before_script:
    - export KUBECONFIG=$KubeConfig_Raypro_dev
  script:
    - mkdir -p cache/
    - echo "dev" > cache/env.txt
    - export resources=$(kubectl get cm resources-setting -o jsonpath={.data.$TgsSettingKey})
    - export dedicated=$(kubectl get cm tgs-settings -o jsonpath={.data.dedicated})
    - export node_selector=$(kubectl get cm tgs-settings -o jsonpath={.data.node-selector})
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template tgs \
        -f - 
      {
        "nodeSelector": $node_selector,
        "tolerations": [$dedicated],
        "resources": $resources
      }
      EOF
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template tgs \
        -f - \
        | kubectl -n $namespace apply -f -
      {
        "nodeSelector": $node_selector,
        "tolerations": [$dedicated],
        "resources": $resources
      }
      EOF
  cache:
    key: job-cache
    paths:
      - cache/
deploy-staging:
  variables:
    GIT_STRATEGY: none
    namespace: staging
    Job: deploy-staging
  environment:
    name: staging
  stage: deploy-staging
  needs:
    - deploy-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  before_script:
    - export KUBECONFIG=$KubeConfig_Raypro_staging
  script:
    - mkdir -p cache/
    - echo "staging" > cache/env.txt
    - export resources=$(kubectl get cm resources-setting -o jsonpath={.data.$TgsSettingKey})
    - export dedicated=$(kubectl get cm tgs-settings -o jsonpath={.data.dedicated})
    - export node_selector=$(kubectl get cm tgs-settings -o jsonpath={.data.node-selector})
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template tgs \
        -f - 
      {
        "nodeSelector": $node_selector,
        "tolerations": [$dedicated],
        "resources": $resources
      }
      EOF
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template tgs \
        -f - \
        | kubectl -n $namespace apply -f -
      {
        "nodeSelector": $node_selector,
        "tolerations": [$dedicated],
        "resources": $resources
      }
      EOF

deploy-prod:
  variables:
    GIT_STRATEGY: none
    namespace: prod
    Job: deploy-prod
  environment:
    name: prod
  stage: deploy-prod
  needs:
    - deploy-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  before_script:
    - export KUBECONFIG=$KubeConfig_Raypro_prod
  script:
    - mkdir -p cache/
    - echo "prod" > cache/env.txt
    - export resources=$(kubectl get cm resources-setting -o jsonpath={.data.$TgsSettingKey})
    - export dedicated=$(kubectl get cm tgs-settings -o jsonpath={.data.dedicated})
    - export node_selector=$(kubectl get cm tgs-settings -o jsonpath={.data.node-selector})
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template tgs \
        -f - 
      {
        "nodeSelector": $node_selector,
        "tolerations": [$dedicated],
        "resources": $resources
      }
      EOF
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template tgs \
        -f - \
        | kubectl -n $namespace apply -f -
      {
        "nodeSelector": $node_selector,
        "tolerations": [$dedicated],
        "resources": $resources
      }
      EOF
  cache:
    key: job-cache
    paths:
      - cache/
notification:
  stage: .post
  cache:
    key: job-cache
    paths:
      - cache/
  script: 
    - printenv
    - pwd
    - export Env=$(cat cache/env.txt)
    - |
      curl --location --request POST $Telegram_Bot_Url \
      --header 'Content-Type: application/json' \
      --data-raw "{
          \"chat_id\": $Telegram_Chat_Id,
          \"text\": \"Project: $CI_PROJECT_NAME\nBranch: $CI_COMMIT_BRANCH\nEnv: $Env\nPipeline: $CI_PIPELINE_URL\nCommit: $CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA\nStarted by: $GITLAB_USER_LOGIN\",
          \"parse_mode\": \"HTML\"
      }"
