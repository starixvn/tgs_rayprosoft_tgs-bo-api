apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "backoffice-api.fullname" . }}
data:
  appsettings.json: |
    {
      "ConnectionStrings": {
        "GameProvidersPluggable": "http://game-pluggable-service"
      },
      "File": {
        "FileServiceBaseUrl": "http://file-service"
      },
      "Report": {
        "Url": "http://report-api"
      },
      "Promotion": {
        "Url": "http://promotion-api"
      },
      "BrandCertificate": {
        "Url": "http://brand-cert-api"
      },
      "BackOffice": {
        "PaymentServiceBaseUrl": "http://payment-api",
        "CashBaseUrl": "http://cashservice-api",
        "GameProvidersPluggableBaseUrl": "http://game-pluggable-service",
        "ReportAggregateUrl": "http://report-aggregate-service",
        "PlayerServiceBaseUrl": "http://player-api",
        "MarketingReportBaseUrl": "http://marketing-report-api",
        "VipLevelServiceBaseUrl": "http://tgs-viplevel",
        "PlayerBucketBaseUrl": "http://tgs-playerbucket-service",
        "DepositAccumulateRouletteServiceBaseUrl": "http://tgs-deposit-accumulate-roulette",
        "StationLetterBaseUrl": "http://tgs-station-letter",
        "CashQueryBaseUrl": "http://tgs-cashservice-query",
        "AgentBaseUrl": "http://agent-service",
        "GameWagersServiceBaseUrl": "http://game-gamewagers",
        "ArticleManagementBaseUrl": "http://tgs-article-management",
        "PlayerAllAgentBaseUrl": "http://player-all-agent-service",
        "BrandGameCreditsBaseUrl": "http://brand-gamecredits/",
        "NotificationContactsBaseUrl": "http://notification-contacts/",
        "AgentDividendBaseUrl": "http://agent-dividend-service",
        "SmsBaseUrl": "http://sms-service"
      },
      "TGSGameProvidersKickPlayerApi": {
        "BaseUrl": "http://game-kickplayer-server"
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]

