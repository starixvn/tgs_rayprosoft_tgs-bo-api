syntax = "proto3";

option csharp_namespace = "Tgs.BrandService.Protos";
package brandservice;

import "phoenix/protobuf/guid.proto";

message ClearMaintenanceCacheRequest {
	phoenix.protobuf.GuidValue brand_id = 1;	
}

message ProcessAdjustBalanceBatchRequest {
	phoenix.protobuf.GuidValue brand_id = 1;
	phoenix.protobuf.GuidValue batch_id = 2;
	string adjust_transfer_type = 3;
	bool include_in_net_profit = 4;
	phoenix.protobuf.GuidValue modify_user_id = 5;
	string modify_user_name = 6;
}

message ProcessOfflineTempUserBatchRequest {
	phoenix.protobuf.GuidValue batch_id = 1;
}

message Tag {
	string name = 1;
	string value = 2;
}

message NotifyEvent {
	repeated Tag tags = 1;
	string data = 2;
}